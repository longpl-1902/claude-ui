appId: com.longpl.agentconsole
productName: Agent Console
files:
  - out/**
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**
win:
  target: nsis
  artifactName: AgentConsole-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: longpl-1902
  repo: claude-ui

extraResources:
  - from: resources/hook
    to: hook
